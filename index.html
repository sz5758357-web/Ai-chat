<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - Klon z 20+ modelami</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar jak w ChatGPT -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <button id="newChatBtn" class="new-chat-btn">✨ Nowy czat</button>
                <button id="toggleSidebar" class="toggle-btn">☰</button>
            </div>
            
            <div class="sidebar-section">
                <h3>📡 Tryb</h3>
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="auto">🔄 Auto</button>
                    <button class="mode-btn" data-mode="online">🌐 API</button>
                    <button class="mode-btn" data-mode="offline">📴 Offline</button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>🧠 Wybierz model</h3>
                <select id="modelSelect">
                    <optgroup label="🔥 OpenAI">
                        <option value="gpt-4o">GPT-4o (najnowszy)</option>
                        <option value="gpt-4o-mini">GPT-4o-mini</option>
                        <option value="gpt-4-turbo">GPT-4 Turbo</option>
                        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    </optgroup>
                    <optgroup label="🧠 Anthropic">
                        <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
                        <option value="claude-3-haiku">Claude 3 Haiku</option>
                    </optgroup>
                    <optgroup label="🔵 Google">
                        <option value="gemini-pro">Gemini Pro</option>
                        <option value="gemini-flash">Gemini Flash</option>
                    </optgroup>
                    <optgroup label="⚡ Inne">
                        <option value="deepseek-chat">DeepSeek Chat</option>
                        <option value="mistral-large">Mistral Large</option>
                        <option value="llama-3-70b">Llama 3 70B</option>
                        <option value="mixtral-8x7b">Mixtral 8x7B</option>
                    </optgroup>
                </select>
            </div>

            <div class="sidebar-section" id="apiKeySection">
                <h3>🔑 Klucz API</h3>
                <input type="password" id="apiKeyInput" placeholder="Wpisz swój klucz API">
                <small>Dla modeli OpenAI, Anthropic, Google itp.</small>
            </div>

            <div class="sidebar-section">
                <h3>📦 Offline</h3>
                <div id="offlineStatus">💡 Nie załadowano</div>
                <button id="loadOfflineBtn" class="btn-secondary">⬇️ Pobierz model</button>
                <div id="progressContainer" style="display:none;">
                    <div id="progressBar"><div id="progressFill" style="width:0%"></div></div>
                    <span id="progressText">0%</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="clearBtn" class="btn-danger">🗑️ Wyczyść</button>
                <button id="exportBtn" class="btn-secondary">📥 Export</button>
                <button id="importBtn" class="btn-secondary">📤 Import</button>
                <input type="file" id="importFile" accept=".json" style="display:none">
            </div>
        </aside>

        <!-- Główny czat -->
        <main id="chat">
            <header id="chatHeader">
                <div class="chat-title">
                    <span id="chatTitle">💬 Nowa rozmowa</span>
                    <span id="modelDisplay" class="model-badge">GPT-4o</span>
                </div>
                <div id="connectionStatus" class="status-online">● Online</div>
            </header>

            <div id="messagesContainer">
                <div id="messages"></div>
                <div id="scrollToBottom" onclick="scrollToBottom()">⬇️</div>
            </div>

            <div id="inputArea">
                <div id="filePreview"></div>
                <div class="input-row">
                    <button id="attachBtn" class="icon-btn" title="Załącz plik">📎</button>
                    <input type="file" id="fileInput" multiple style="display:none">
                    <textarea id="userInput" rows="1" placeholder="Napisz wiadomość..."></textarea>
                    <button id="sendBtn" class="send-btn">➤</button>
                </div>
                <div class="input-footer">
                    <span id="wordCount">0 słów</span>
                    <span id="contextInfo">📏 0/128k</span>
                </div>
            </div>
        </main>
    </div>

    <script type="importmap">
        {
            "imports": {
                "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@2.17.0/dist/transformers.js"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
